name: Deploy web calculator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/webcalculator/**'
      - 'src/**'
      - 'data/**'
      - 'scripts/build-web-sample.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and test the library and checked-in browser bundle
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload calculator site
        uses: actions/upload-pages-artifact@v4
        with:
          path: examples/webcalculator

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish calculator
        id: deployment
        uses: actions/deploy-pages@v4
